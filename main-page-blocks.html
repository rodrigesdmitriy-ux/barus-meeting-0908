<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Структура сайта (схема)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f6f8;font:15px/1.6 Montserrat,Tahoma,sans-serif;color:#232323}
.wrap{max-width:1100px;margin:0 auto;padding:32px 40px 64px;background:#fff}
h1,h2,h3{font-family:'Russo One',Montserrat,sans-serif;font-weight:400;color:#232323}
h1{font-size:28px;border-bottom:3px solid #42c1c7;padding-bottom:12px;margin:0 0 20px}
h2{font-size:21px;margin:36px 0 12px;color:#0e6d73}
h3{font-size:17px;margin:24px 0 8px}
table{border-collapse:collapse;width:100%;margin:12px 0 20px;font-size:14px}
th{background:#232323;color:#fff;text-align:left;padding:9px 10px;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid #e3e7ec;vertical-align:top}
tr:nth-child(even) td{background:#f7f9fb}
code{font:13px Menlo,Consolas,monospace;background:#eef6f7;color:#0e6d73;padding:1px 5px;border-radius:3px}
pre{background:#f4f6f8;border-left:4px solid #42c1c7;padding:14px 18px;overflow:auto;font-size:13px;line-height:1.5}
pre code{background:none;padding:0}
a{color:#0e6d73}
img{max-width:100%;border:1px solid #e3e7ec}
li{margin:4px 0}
@media print{body{background:#fff}.wrap{padding:0}h2{break-after:avoid}tr{break-inside:avoid}}
</style></head><body><div class="wrap"><h1>Структура сайта (схема)</h1>
<h3>Схема рекомендованной структуры</h3>
<p><a href="site-tree.svg" target="_blank">Открыть схему отдельно</a></p>
<img src="site-tree.svg" alt="Схема иерархии нового сайта barus.tools" style="width:100%;border:1px solid #e3e7ec;border-radius:6px">
</div></body></html>
